# =====================================================
# Configuracao do sistema de reserva de postos
# Formato: chave=valor   (linhas com # sao comentarios)
# =====================================================

# --- Base de dados (usado so pelo servidor) ---
db.url=jdbc:postgresql://localhost:5432/carregamentos
db.user=sd_user
db.password=sd_pass

# --- RMI (servidor + cliente geral) ---
rmi.host=localhost
rmi.port=1099
rmi.nome=ServicoPostos

# --- Sockets TCP (servidor + cliente admin) ---
socket.host=localhost
socket.port=5000
